# ==================== 告示牌设置 ====================
sign-settings:
  delayed-replace:
    enable: true
    delay-ticks: 1

# ==================== 惩罚命令配置 ====================
punish-commands:
  levels:
    level-1:
      3:
        - "mute %player%"
        - "say [警告] %player% 因多次使用违禁词被禁言！"
      5:
        - "ban %player%"