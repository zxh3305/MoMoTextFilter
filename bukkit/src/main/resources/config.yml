# MoMoTextFilter 配置文件
# 版本: 2.0.2

# ==================== 语言配置 ====================
language: zh_CN

# ==================== 违禁词配置 ====================
banned-words:
  level-1:
    - 傻逼
    - fuck
    - cnm
    - admin
    - op
    - hypixel
  level-2:
    - 违禁词1
    - 违禁词2
    - 违禁词3
    - 敏感词1
    - 敏感词2

# ==================== 白名单配置 ====================
whitelist:
  - SM
  - sm
  - Sm
  - sM
  - asset

# ==================== 模糊匹配配置 ====================
fuzzy-match:
  enable: true
  levels:
    level-1:
      # 违禁词字符之间允许插入的间隔字符数量上限（按字符类型分别配置）：
      #   chinese: 中文间隔字符数量上限
      #   english: 英文间隔字符数量上限
      #   others:  其他（数字/标点/符号等）间隔字符数量上限
      # 任意一类间隔字符数量超过对应上限，则该词直接放行（不视为违禁词）。
      # 例：配置 chinese: 3 时，"傻他妈的逼" 中间 3 个中文间隔字符可匹配 "傻逼"；
      #     而 "傻" + 51 个英文字符 + "逼" 因 english: 50 超限而放行。
      max-char-gap:
        chinese: 3
        english: 50
        others: 300
      max-chatbox-gap: 3
    level-2:
      max-char-gap:
        chinese: 3
        english: 50
        others: 300
      max-chatbox-gap: 0

# ==================== 反向匹配配置 ====================
reverse-match:
  enable: true
  levels:
    level-1: true
    level-2: true

# ==================== 外部插件/命令配置 ====================
# 格式说明:
#   type-name: 命令类型名称（用于在 messages 文件中配置显示名称）
#   enable: 是否启用检测
#   args-number: 需要检测的参数序号，多个用逗号分隔（从1开始）
#                例如 args-number: 2,3 表示检测第2和第3个参数
#   extend-to-end: 是否将检测范围延续到命令结尾（默认false）
#                  当设为true时，检测内容从指定参数开始一直到命令结束
#                  这对于包含空格的消息很有用，例如 "/msg 玩家名 hello world"
#   commands: 命令列表（支持完整命令名或简写）
external-plugins:
  cmi-msg:
    enable: true
    args-number: 2
    extend-to-end: true
    commands:
      - "/cmi msg"
      - "/msg"
      - "/tell"
      - "/w"
      - "/whisper"
      - "/pm"
      - "/m"
      - "/t"
  cmi-reply:
