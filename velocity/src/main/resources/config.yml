# MoMoTextFilter 配置文件
# 版本: 2.0.2

# ==================== 语言配置 ====================
language: zh_CN

# ==================== 违禁词配置 ====================
banned-words:
  level-1:
    - 傻逼
    - fuck
    - cnm
    - admin
    - op
    - hypixel
  level-2:
    - 违禁词1
    - 违禁词2
    - 违禁词3
    - 敏感词1
    - 敏感词2

# ==================== 白名单配置 ====================
whitelist:
  - SM
  - sm
  - Sm
  - sM
  - asset

# ==================== 模糊匹配配置 ====================
fuzzy-match:
  enable: true
  levels:
    level-1:
      max-char-gap: 1
      max-chatbox-gap: 3
    level-2:
      max-char-gap: 2
      max-chatbox-gap: 0

# ==================== 反向匹配配置 ====================
reverse-match:
  enable: true
  levels:
    level-1: true
    level-2: true

# ==================== 外部插件/命令配置 ====================
# 格式说明:
#   type-name: 命令类型名称（用于在 messages 文件中配置显示名称）
#   enable: 是否启用检测
#   args-number: 需要检测的参数序号，多个用逗号分隔（从1开始）
#                例如 args-number: 2,3 表示检测第2和第3个参数
#   extend-to-end: 是否将检测范围延续到命令结尾（默认false）
#                  当设为true时，检测内容从指定参数开始一直到命令结束
#                  这对于包含空格的消息很有用，例如 "/msg 玩家名 hello world"
#   commands: 命令列表（支持完整命令名或简写）
# 
# 提示: 您可以在此处添加更多自定义命令检测配置
external-plugins:
  servershout-invite:
    enable: true
    args-number: 1
    extend-to-end: true
    commands:
      - "/invite"
      - "/yq"

  # ServerShout 喊话检测配置
  # 支持命令模式（/hh, /shout）和前缀模式（!）
  servershout-shout:
    enable: true
    args-number: 1
    extend-to-end: true
    commands:
      - "/hh"
      - "/shout"
    # 前缀列表：匹配以这些字符开头的聊天消息
    # 例如 "!" 表示检测所有以 "!" 开头的聊天消息
    # 可以自定义其他字符，如 "@"、"#" 等
    prefixes:
      - "!"

# ==================== 惩罚命令配置 ====================
punish-commands:
  levels:
    level-1:
      3:
        - "mute %player%"
        - "say [警告] %player% 因多次使用违禁词被禁言！"
      5:
        - "ban %player%"
