pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'MoMoTextFilter'

// fabric 为独立构建模块（含自有 settings.gradle.kts 与 fabric-loom 版本定义），
// 不能被根项目 include，否则根项目解析 fabric-loom 插件时会因缺少版本号而失败。
include 'bukkit'
include 'velocity'

project(':bukkit').projectDir = new File(settingsDir, 'bukkit')
project(':velocity').projectDir = new File(settingsDir, 'velocity')

